<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北海道五日遊行程手冊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f1f5f9;
            background-image: linear-gradient(rgba(241, 245, 249, 0), rgba(241, 245, 249, 0)), 
                      url('https://lh3.googleusercontent.com/d/1Y8JGOH_YWgpdk9klp93Evt3anzVeGpA2');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: #1e293b;
            line-height: 1.5;
            letter-spacing: 0.01em;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .gradient-header { 
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.95) 0%, rgba(30, 64, 175, 0.9) 100%);
        }

        .card-shadow { 
            box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.08); 
        }

        .big-button {
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .big-button:active { transform: scale(0.96); opacity: 0.9; }

        .itinerary-content {
            max-height: 10000px;
            transition: max-height 0.5s ease-in-out, opacity 0.3s;
            overflow: hidden;
        }
        .itinerary-content.collapsed {
            max-height: 0;
            opacity: 0;
        }

        .important-label {
            font-size: 1.05rem;
            color: #1e3a8a;
            font-weight: 800;
            margin-bottom: 12px;
            display: block;
            border-left: 5px solid #3b82f6;
            padding-left: 10px;
            background: linear-gradient(to right, rgba(239, 246, 255, 0.8), transparent);
        }

        .day-badge {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
        }
    </style>
</head>
<body class="pb-20">

    <div id="app">
        <!-- 頂部標題區 -->
        <header class="gradient-header text-white px-6 py-10 shadow-xl rounded-b-[3.5rem] mb-8 relative overflow-hidden">
            <div class="max-w-md mx-auto relative z-10">
                <h1 class="text-3xl font-black mb-8 leading-tight tracking-tight drop-shadow-sm" id="tour-name"></h1>
                
                <!-- 領隊資訊卡 -->
                <div style="display: none;" class="bg-white/15 backdrop-blur-md p-5 rounded-[2.5rem] border border-white/20 shadow-xl">
                    <div class="flex items-center space-x-4 mb-6">
                        <div class="w-14 h-14 p-0.5 bg-white rounded-xl shadow-md">
                            <div class="w-full h-full bg-blue-50 rounded-lg flex items-center justify-center text-blue-700">
                                <i class="fas fa-user-tie text-2xl"></i>
                            </div>
                        </div>
                        <div>
                            <span class="text-blue-100 text-[10px] font-bold tracking-widest uppercase opacity-80">專業服務領隊</span>
                            <p class="text-2xl font-black" id="leader-name"></p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-3.5">
                        <a id="phone-tw" class="big-button bg-white text-blue-800">
                            <i class="fas fa-phone-alt mr-2.5 text-blue-500"></i> 撥打 台灣聯絡電話
                        </a>
                        <a id="phone-jp" class="big-button bg-sky-500 text-white border border-sky-400">
                            <i class="fas fa-mobile-alt mr-2.5"></i> 撥打 日本漫遊電話
                        </a>
                    </div>
                </div>
            </div>
			<a href="https://www.gounitravel.com/html/meet/26/26jh405it53.htm?20260401134936005" target="_blank" class="absolute bottom-4 right-6 text-sm font-bold text-white/80 hover:text-white transition-opacity">
				<i class="fas fa-external-link-alt mr-1"></i> 查看原始行程
			</a>
        </header>

        <main class="max-w-md mx-auto px-4">
            <!-- 航班區 -->
            <section class="mb-10">
                <h2 class="text-xl font-black text-slate-800 mb-5 px-2 flex items-center">
                    <span class="bg-blue-600 w-2 h-6 rounded-full mr-3 shadow-md shadow-blue-200"></span>
                    航班時刻表
                </h2>
                <div class="glass-card rounded-[2.5rem] p-6 card-shadow space-y-10" id="flights-container"></div>
            </section>

            <!-- 行程清單 -->
            <section>
                <h2 class="text-xl font-black text-slate-800 mb-5 px-2 flex items-center">
                    <span class="bg-blue-600 w-2 h-6 rounded-full mr-3 shadow-md shadow-blue-200"></span>
                    每日詳細行程
                </h2>
                <div id="itinerary-container" class="space-y-8"></div>
            </section>
        </main>
    </div>
	<a href="#app" class="fixed bottom-6 right-6 w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg hover:bg-blue-700 transition-colors">
		<i class="fas fa-arrow-up"></i>
	</a>

                { "name": "札幌工廠 (Sapporo Factory)", "map": "https://www.google.com/maps/search/?api=1&query=札幌工廠", "info": "https://trippino-hokkaido.com/tw/blog/enjoy_sapporo_factory_in_3hours/" }
              ],
              "meals": { "breakfast": "飯店內早餐", "lunch": "日式拉麵套餐", "dinner": "日式涮涮鍋吃到飽" },
              "hotel": {
                "zh": "APA酒店及度假村 札幌",
                "en": "APA HOTEL & RESORT SAPPORO",
                "addr": "北海道札幌市南區川沿4條2丁目",
                "map": "https://www.google.com/maps/search/?api=1&query=APA+Hotel+Resort+Sapporo",
                "info": "https://www.facebook.com/permalink.php?story_fbid=pfbid0237BeHiBppZNXMMwNUBW1CJBiKBfPCFNW9iWgfV9msy9JtJQaNVyipFYuEn92bDaal&id=100089998485275"
              }
            },
            {

              "date": "2026/04/07",
              "locations": [
                { "name": "免稅店", "map": "", "info": "" },
                { "name": "北海道神宮", "map": "https://www.google.com/maps/search/?api=1&query=北海道神宮", "info": "https://www.gltjp.com/zh-hant/article/item/20333/" },
                { "name": "小樽運河步道", "map": "https://www.google.com/maps/search/?api=1&query=小樽運河", "info": "https://www.gltjp.com/zh-hant/article/item/20442/" },

                { "name": "歐風蒸氣鐘", "map": "https://www.google.com/maps/search/?api=1&query=小樽蒸氣鐘", "info": "https://tahokkaido.com/otaru-marchen-crossroads/" },

                { "name": "大通公園", "map": "https://www.google.com/maps/search/?api=1&query=大通公園", "info": "https://www.gltjp.com/zh-hant/article/item/20869/" }
              ],
              "meals": { "breakfast": "飯店內早餐", "lunch": "北海道烤魚定食+火烤扇貝", "dinner": "日式燒肉吃到飽" },
              "hotel": {
                "zh": "APA酒店及度假村 札幌",
                "en": "APA HOTEL & RESORT SAPPORO",
                "addr": "北海道札幌市南區川沿4條2丁目",

              }
            },
            {
              "day": 4,
              "date": "2026/04/08",
              "locations": [
                { "name": "支笏湖國立公園", "map": "https://www.google.com/maps/search/?api=1&query=支笏湖", "info": "https://www.gltjp.com/zh-hant/directory/item/12775/" },
                { "name": "洞爺湖 SAIRO 展望台", "map": "https://www.google.com/maps/search/?api=1&query=洞爺湖展望台", "info": "https://gototravel.tw/silo-viewing-platform/" },
                { "name": "函館山夜景", "map": "https://www.google.com/maps/search/?api=1&query=函館山夜景展望台", "info": "https://www.gltjp.com/zh-hant/article/item/20398/" }
              ],

                "en": "YUNOKAWA KANKO HOTEL SHOEN",
                "addr": "北海道函館市湯川町2丁目4-20",
                "map": "https://www.google.com/maps/search/?api=1&query=湯之川觀光酒店+祥苑",
                "info": "https://stmusictraveler.com/yunokawa-kanko-hotel-shoen/"
              }
            },
            {
              "day": 5,
              "date": "2026/04/09",
              "locations": [

                { "name": "函館機場", "map": "https://www.google.com/maps/search/?api=1&query=函館空港", "info": "" },
                { "name": "桃園國際機場", "map": "https://www.google.com/maps/search/?api=1&query=桃園國際機場", "info": "" }
              ],
              "meals": { "breakfast": "飯店內早餐", "lunch": "機上精緻餐食", "dinner": "溫慢的家" },
              "hotel": { "zh": "溫暖的家", "en": "Home Sweet Home", "addr": "台灣", "map": "", "info": "" }
            }
          ]
        };

        // 初始化
        document.getElementById('tour-name').innerHTML = tourData.tour_info.name;
        document.getElementById('leader-name').textContent = tourData.tour_info.leader.name;
        document.getElementById('phone-tw').href = `tel:${tourData.tour_info.leader.phone_tw}`;
        document.getElementById('phone-jp').href = `tel:${tourData.tour_info.leader.phone_jp}`;

        const f = tourData.flights;
        document.getElementById('flights-container').innerHTML = `
            <div>
                <span class="important-label">【去程】 ${f.outbound.date}</span>
                <div class="flex justify-between items-center bg-blue-50/70 p-6 rounded-[2rem] border border-blue-100 shadow-inner">
                    <div class="text-center flex-1">
                        <p class="text-[9px] font-black text-blue-400 uppercase mb-1">${f.outbound.from}</p>
                        <p class="text-3xl font-black text-blue-900">${f.outbound.dep}</p>
                    </div>
                    <div class="px-3 flex flex-col items-center">
                        <span class="text-[9px] font-bold text-blue-400 mb-1.5">${f.outbound.airline}</span>
                        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm">

                        </div>
                    </div>

                    </div>
                </div>
            </div>
            <div class="pt-2">
                <span class="important-label">【回程】 ${f.inbound.date}</span>

                    <div class="text-center flex-1">
                        <p class="text-[9px] font-black text-slate-400 uppercase mb-1">${f.inbound.from}</p>
                        <p class="text-3xl font-black text-slate-800">${f.inbound.dep}</p>
                    </div>
                    <div class="px-3 flex flex-col items-center">
                        <span class="text-[9px] font-bold text-slate-400 mb-1.5">${f.inbound.airline}</span>
                        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm">

                        <p class="text-3xl font-black text-slate-800">${f.inbound.arr}</p>
                    </div>
                </div>

        function toggle(d) {
            const el = document.getElementById(`day-content-${d}`);
            const icon = document.getElementById(`day-icon-${d}`);
            const isCollapsed = el.classList.toggle('collapsed');
            icon.className = isCollapsed ? 'fas fa-chevron-down' : 'fas fa-chevron-up';
        }

        const container = document.getElementById('itinerary-container');
        tourData.daily_itinerary.forEach(day => {
            const isFirst = day.day === 1;
            const card = document.createElement('div');
            card.className = "glass-card rounded-[3rem] card-shadow overflow-hidden";
            
            const locsHtml = day.locations.map(loc => `
                <div class="p-5 bg-white/60 rounded-[1.5rem] mb-4 border border-white/50 shadow-sm">
                    <p class="text-xl font-black text-slate-800 mb-3">${loc.name}</p>
                    <div class="grid grid-cols-2 gap-3">
                        ${loc.map ? `<a href="${loc.map}" target="_blank" class="flex items-center justify-center bg-white border border-rose-100 text-rose-500 py-2.5 rounded-xl font-bold text-xs"><i class="fas fa-map-marked-alt mr-1.5"></i> 看地圖</a>` : ''}
                        ${loc.info ? `<a href="${loc.info}" target="_blank" class="flex items-center justify-center bg-white border border-blue-100 text-blue-600 py-2.5 rounded-xl font-bold text-xs"><i class="fas fa-search mr-1.5"></i> 看介紹</a>` : ''}
                    </div>
                </div>
            `).join('');

            card.innerHTML = `
                <div class="p-6 flex justify-between items-center cursor-pointer active:bg-blue-50/50" onclick="toggle(${day.day})">
                    <div class="flex items-center space-x-5">
                        <div class="day-badge text-white w-14 h-14 flex flex-col items-center justify-center rounded-[1.2rem] shadow-lg">
                            <span class="text-[8px] font-black opacity-80 uppercase tracking-tighter">Day</span>
                            <span class="text-2xl font-black leading-none">${day.day}</span>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-blue-600 tracking-wider">${day.date}</p>
                            <p class="text-xl font-black text-slate-800">點此查看詳情</p>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                        <i id="day-icon-${day.day}" class="fas ${isFirst ? 'fa-chevron-up' : 'fa-chevron-down'} text-sm"></i>
                    </div>
                </div>
                
                <div id="day-content-${day.day}" class="itinerary-content px-5 pb-8 ${isFirst ? '' : 'collapsed'}">
                    <div class="mt-2">
                        <span class="important-label">景點行程</span>
                        ${locsHtml}
                    </div>

                    <div class="mt-8">
                        <span class="important-label">今日用餐</span>
                        <div class="grid grid-cols-1 gap-2.5">
                            <div class="bg-white/50 p-4 rounded-2xl flex items-center border border-white">
                                <div class="w-8 h-8 bg-slate-200/50 rounded-full flex items-center justify-center text-slate-500 font-black text-sm mr-3">早</div>
                                <span class="text-lg font-bold text-slate-700">${day.meals.breakfast}</span>
                            </div>
                            <div class="bg-white/50 p-4 rounded-2xl flex items-center border border-white">
                                <div class="w-8 h-8 bg-slate-200/50 rounded-full flex items-center justify-center text-slate-500 font-black text-sm mr-3">午</div>
                                <span class="text-lg font-bold text-slate-700">${day.meals.lunch}</span>
                            </div>
                            <div class="bg-orange-100/40 p-4 rounded-2xl flex items-center border border-orange-200/30">
                                <div class="w-8 h-8 bg-orange-400 rounded-full flex items-center justify-center text-white font-black text-sm mr-3">晚</div>
                                <span class="text-lg font-black text-orange-900">${day.meals.dinner}</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-8 bg-blue-600/5 p-6 rounded-[2.5rem] border border-blue-200/20">
                        <span class="important-label !bg-blue-100/50 !text-blue-800 !border-blue-500">住宿飯店</span>
                        <p class="text-xl font-black text-slate-900 mb-1">${day.hotel.zh}</p>
                        <p class="text-xs font-bold text-blue-600 opacity-80 mb-3">${day.hotel.en}</p>
                        <p class="text-[10px] font-bold text-slate-400 mb-6"><i class="fas fa-map-marker-alt mr-1"></i> ${day.hotel.addr}</p>
                        <div class="flex flex-col gap-3">
                            ${day.hotel.map ? `<a href="${day.hotel.map}" target="_blank" class="big-button bg-blue-600 text-white"><i class="fas fa-directions mr-2"></i> 導航去飯店</a>` : ''}
                            ${day.hotel.info ? `<a href="${day.hotel.info}" target="_blank" class="big-button bg-white text-blue-700 border border-blue-100 shadow-sm"><i class="fas fa-hotel mr-2 text-blue-300"></i> 飯店資訊</a>` : ''}
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
